<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban-Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="appContainer">
        <aside>
            <header class="sidebar">
                <img src="logo.jpeg" alt="logo" class="mainLogo">
                <p>TaskFlow</p>
            </header>
            <ul style="list-style: none;">
                <li class="iconElement">
                    <img src="Dash Board.png" alt="" class="icons">
                    <span>Dashboard</span>
                </li>
                <li class="iconElement">
                    <img src="checkbox.png" alt="" class="icons">
                    <span>My Tasks</span>
                </li>
                <li class="iconElement">
                    <img src="app.png" alt="" class="icons">
                    <span>Kanban Board</span>
                </li>
                <li class="iconElement">
                    <img src="calendar.png" alt="" class="icons">
                    <span>Calender</span>
                </li>
                <li class="iconElement">
                    <img src="analytics.png" alt="" class="icons">
                    <span>Analytics</span>
                </li>
                <li class="iconElement">
                    <img src="settings.png" alt="" class="icons">
                    <span>Settings</span>
                </li>
            </ul>
            <footer id="foot">
                <div class="prof">
                    <img src="logo.jpeg" alt="" id="footerLogo">
                    <div>
                        <p id="name">Abdul Razaq Ramdurg</p>
                        <p>abdul@gmail.com</p>
                    </div>
                </div>
            </footer>
        </aside>
        <main>
            <header class="workSpace">
                <div class="header-left">
                    <h2>Project Board</h2>

                    <div class="drop">
                        <button class="dropdown">
                            <span>Website Redesign</span>
                            <span class="arrow">▼</span>
                        </button>
                    </div>

                    <input type="text" class="search" placeholder="Search tasks...">
                </div>

                <button class="addTask" type="button">Add Task</button>

                <form class="add" id="modalOverlay">
                    <div class="form-header">
                        <h2>Add New Task</h2>
                        <button type="button" class="cancel">Close</button>
                    </div>

                    <div class="form-group">
                        <label for="task-title">Title</label>
                        <input type="text" id="task-title" name="title" placeholder="Enter task title" required>
                    </div>

                    <div class="form-group">
                        <label for="task-desc">Description</label>
                        <textarea id="task-desc" name="description" placeholder="Enter description" rows="3"
                            required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="task-tag">Category</label>
                        <select id="task-tag" name="tag" required>
                            <option value="UI/UX">UI/UX</option>
                            <option value="Frontend">Frontend</option>
                            <option value="Backend">Backend</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <div class="radio-group">
                            <input type="radio" id="status-backlog" name="status" value="backlog" checked>
                            <label for="status-backlog">Backlog</label>

                            <input type="radio" id="status-todo" name="status" value="todo">
                            <label for="status-todo">To Do</label>

                            <input type="radio" id="status-progress" name="status" value="in-progress">
                            <label for="status-progress">In Progress</label>

                            <input type="radio" id="status-review" name="status" value="review">
                            <label for="status-review">Review</label>

                            <input type="radio" id="status-done" name="status" value="done">
                            <label for="status-done">Done</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Priority</label>
                        <div class="radio-group">
                            <input type="radio" id="priority-low" name="priority" value="low" checked>
                            <label for="priority-low">Low</label>

                            <input type="radio" id="priority-medium" name="priority" value="medium">
                            <label for="priority-medium">Medium</label>

                            <input type="radio" id="priority-high" name="priority" value="high">
                            <label for="priority-high">High</label>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="submit-btn">Create Task</button>
                    </div>
                </form>

                <div class="header-right">
                    <button class="filter">
                        <img src="app.png" alt="" class="icons">
                        <span>Filter</span>
                    </button>

                    <button class="sort">
                        <img src="app.png" alt="" class="icons">
                        <span>Sort</span>
                    </button>

                    <button class="notify">
                        <img src="app.png" alt="" class="icons">
                    </button>

                    <div class="divider"></div>

                    <button class="theme">
                        <img src="app.png" alt="" class="icons">
                    </button>

                    <img src="logo.jpeg" alt="logo" class="mainLogo">
                </div>
            </header>
            <section class="content">
                <div class="kanbancolumn" data-status="backlog">
                    <div class="columnHeader">
                        <h2>Backlog</h2>
                        <span class="taskCount">0</span>
                    </div>
                    <div class="taskList"></div>
                </div>
                <div class="kanbancolumn" data-status="todo">
                    <div class="columnHeader">
                        <h2>To-Do</h2>
                        <span class="taskCount">0</span>
                    </div>
                    <div class="taskList"></div>
                </div>
                <div class="kanbancolumn" data-status="in-progress">
                    <div class="columnHeader">
                        <h2>In-Progress</h2>
                        <span class="taskCount">0</span>
                    </div>
                    <div class="taskList"></div>
                </div>
                <div class="kanbancolumn" data-status="review">
                    <div class="columnHeader">
                        <h2>Review</h2>
                        <span class="taskCount">0</span>
                    </div>
                    <div class="taskList"></div>
                </div>
                <div class="kanbancolumn" data-status="done">
                    <div class="columnHeader">
                        <h2>Done</h2>
                        <span class="taskCount">0</span>
                    </div>
                    <div class="taskList"></div>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
