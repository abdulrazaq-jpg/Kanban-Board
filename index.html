<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban-Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="appContainer">
        <aside>
            <header class="sidebar">
                <img src="logo.jpeg" alt="logo" class="mainLogo">
                <p>TaskFlow</p>
            </header>
            <ul style="list-style: none;">
                <li class="iconElement">
                    <img src="Dash Board.png" alt="" class="icons">
                    <span>Dashboard</span>
                </li>
                <li class="iconElement">
                    <img src="checkbox.png" alt="" class="icons">
                    <span>My Tasks</span>
                </li>
                <li class="iconElement">
                    <img src="app.png" alt="" class="icons">
                    <span>Kanban Board</span>
                </li>
                <li class="iconElement">
                    <img src="calendar.png" alt="" class="icons">
                    <span>Calender</span>
                </li>
                <li class="iconElement">
                    <img src="analytics.png" alt="" class="icons">
                    <span>Analytics</span>
                </li>
                <li class="iconElement">
                    <img src="settings.png" alt="" class="icons">
                    <span>Settings</span>
                </li>
            </ul>
            <footer id="foot">
                <div class="prof">
                    <img src="logo.jpeg" alt="" id="footerLogo">
                    <div>
                        <p id="name">Abdul Razaq Ramdurg</p>
                        <p>abdul@gmail.com</p>
                    </div>
                </div>
            </footer>
        </aside>
        <main>
            <header class="workSpace">
                <div class="header-left">
                    <h2>Project Board</h2>

                    <div class="drop">
                        <button class="dropdown">
                            <span>Website Redesign</span>
                            <span class="arrow">▼</span>
                        </button>
                    </div>

                    <input type="text" class="search" placeholder="Search tasks...">
                </div>
                <div class="header-right">
                    <button class="filter">
                        <img src="app.png" alt="" class="icons">
                        <span>Filter</span>
                    </button>

                    <button class="sort">
                        <img src="app.png" alt="" class="icons">
                        <span>Sort</span>
                    </button>

                    <button class="notify">
                        <img src="app.png" alt="" class="icons">
                    </button>

                    <div class="divider"></div>

                    <button class="theme">
                        <img src="app.png" alt="" class="icons">
                    </button>

                    <img src="logo.jpeg" alt="logo" class="mainLogo">
                </div>
            </header>
            <div class="content">
                <div class="boxes"></div>
                <div class="boxes"></div>
                <div class="boxes"></div>
                <div class="boxes"></div>
                <div class="boxes"></div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
